name: Kubernetes Validation

on:
  workflow_call:
    inputs:
      roots:
        description: >-
          Space-separated manifest roots to watch. Each changed unit directory
          under a root is kustomize-built and kubeconform-validated.
          Example: "kubernetes/apps kubernetes/components"
        required: true
        type: string

env:
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"
  KUBERNETES_VERSION: "1.32.0"

jobs:
  detect-changes:
    name: Detect changed manifest directories
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.changed.outputs.paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed manifest directories
        id: changed
        env:
          ROOTS: ${{ inputs.roots }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          fi

          ROOT_RE="$(printf '%s' "${ROOTS}" | tr ' ' '|')"

          # A unit deleted in this PR has nothing left to build, so drop it from the
          # matrix. Deletions inside a surviving unit still validate that unit.
          PATHS=$(echo "${CHANGED}" \
            | grep -E "^(${ROOT_RE})/" \
            | sed -nE "s#^(${ROOT_RE})/([^/]*)/.*#\1/\2#p" \
            | sort -u \
            | while read -r unit; do [ -d "${unit}" ] && echo "${unit}"; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "paths=${PATHS}" >> "${GITHUB_OUTPUT}"
          echo "Changed paths: ${PATHS}"

  validate:
    name: "${{ matrix.path }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.paths != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        path: ${{ fromJson(needs.detect-changes.outputs.paths) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup kustomize
        env:
          KUSTOMIZE_VERSION: ${{ env.KUSTOMIZE_VERSION }}
        run: |
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Setup kubeconform
        env:
          KUBECONFORM_VERSION: ${{ env.KUBECONFORM_VERSION }}
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Kustomize build
        run: |
          kustomize build "${{ matrix.path }}" > /tmp/built.yaml

      - name: Substitute Flux postBuild placeholders
        run: |
          # kubeconform validates raw manifests, but Flux substitutes these
          # placeholders at apply time (from the domain-config secret), so
          # validate with placeholder values of the same shape
          sed -i \
            -e 's/\${LOCAL_DOMAIN}/example.lab/g' \
            -e 's/\${BASE_DOMAIN}/example.lab/g' \
            -e 's/\${ACME_EMAIL}/admin@example.lab/g' \
            -e 's|\${SLACK_WEBHOOK_URL}|https://hooks.example.lab/webhook|g' \
            /tmp/built.yaml

      - name: Kubeconform (warm schema cache)
        env:
          KUBERNETES_VERSION: ${{ env.KUBERNETES_VERSION }}
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: |
          # Downloads the CRD schemas into -cache so the patch step below can fix
          # them; the verdict here is thrown away on purpose (the next Kubeconform
          # run is the gate). See that step for why patching is needed at all.
          mkdir -p "${KUBECONFORM_CACHE}"
          kubeconform \
            -cache "${KUBECONFORM_CACHE}" \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/built.yaml || true

      - name: Kubeconform (patch impossible duration constraints)
        env:
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: |
          # Some published CRD schemas put BOTH `format: duration` and a Go-duration
          # `pattern` on the same property (grafana-operator's GrafanaAlertRuleGroup
          # spec.interval is one). kubeconform reads that format as ISO-8601 (PT1M)
          # while the pattern only accepts Go durations (1m), so the property becomes
          # unsatisfiable: no value passes, and the resource can never validate. The
          # pattern is the stronger check and the one the CRD author intended, so
          # drop the contradictory format -- only where a pattern sits beside it.
          python3 - "${KUBECONFORM_CACHE}" <<'PY'
          import json
          import os
          import sys

          root = sys.argv[1]
          patched = 0
          for dirpath, _dirnames, filenames in os.walk(root):
              for filename in filenames:
                  path = os.path.join(dirpath, filename)
                  try:
                      with open(path) as handle:
                          document = json.load(handle)
                  except (OSError, ValueError):
                      continue

                  def scrub(node):
                      global patched
                      if isinstance(node, dict):
                          if node.get("format") == "duration" and "pattern" in node:
                              del node["format"]
                              patched += 1
                          for value in node.values():
                              scrub(value)
                      elif isinstance(node, list):
                          for value in node:
                              scrub(value)

                  before = json.dumps(document, sort_keys=True)
                  scrub(document)
                  if json.dumps(document, sort_keys=True) != before:
                      with open(path, "w") as handle:
                          json.dump(document, handle)

          print(f"dropped {patched} unsatisfiable duration format(s) from cached schemas")
          PY

      - name: Kubeconform
        env:
          KUBERNETES_VERSION: ${{ env.KUBERNETES_VERSION }}
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: |
          kubeconform \
            -cache "${KUBECONFORM_CACHE}" \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -summary \
            /tmp/built.yaml
