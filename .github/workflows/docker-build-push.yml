name: Docker Build & Push

# Shared container build + GHCR push. One call per image, callers run their
# image jobs in parallel. Building on the caller's own runner means "latest"
# tags stay inside the caller's own gha cache scope (keyed by image name).
on:
  workflow_call:
    inputs:
      image:
        description: >-
          Image name without registry or tag. Pushed as
          ghcr.io/<caller owner>/<image>.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the build context.
        required: true
        type: string
      context:
        description: Build context path.
        required: false
        type: string
        default: "."
      version:
        description: >-
          Image tag. Leave empty to use the repo's latest release tag, falling
          back to "latest" for repos without releases.
        required: false
        type: string
        default: ""
      tag_as_latest:
        description: Also tag the pushed image as ":latest".
        required: false
        type: boolean
        default: false
      build_args:
        description: >-
          Newline-separated KEY=VALUE build arguments, one per line. Blank
          lines are skipped.
        required: false
        type: string
        default: ""

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "${REQUESTED}" ]; then
            TAG="${REQUESTED}"
          else
            # No releases yet -> the "latest" image tag is still a valid tag
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo latest)
          fi
          echo "value=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          TAG: ${{ steps.version.outputs.value }}
          TAG_AS_LATEST: ${{ inputs.tag_as_latest }}
        run: |
          TAGS="${IMAGE}:${TAG}"
          if [ "${TAG_AS_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "value=${TAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }},ignore-error=true
